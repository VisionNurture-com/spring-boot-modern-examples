# 仮想スレッドを有効にする。Spring 公式は Java 24 以降を強く推奨している。
spring.threads.virtual.enabled=true

# 仮想スレッドはデーモンスレッドのため、すべてが仮想スレッドになると JVM が終了しうる。
# 公式の推奨に従い明示的に生かしておく。
spring.main.keep-alive=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:55432/measure}
spring.datasource.username=${DB_USER:measure}
spring.datasource.password=${DB_PASSWORD:measure}

# 計測ごとに run.sh が上書きする。
spring.datasource.hikari.maximum-pool-size=${POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=30000

server.tomcat.max-connections=8192
logging.level.root=WARN
